name: Build & Publish Docs

on:
  push:
    branches: [ "main" ]
    tags:     [ "v*" ]           # tag v1.2.3 => release
  workflow_dispatch:

concurrency:
  group: publish-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build PDFs & PNGs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pandoc + TeX Live pour LuaLaTeX
      - name: Install Pandoc & TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-luatex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra \
            texlive-plain-generic lmodern

      # Python pour exécuter scripts/process.py
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f scripts/requirements.txt ]; then
            python -m pip install -r scripts/requirements.txt
          else
            python -m pip install requests
          fi

      - name: Build (PNG + PDF)
        run: |
          python scripts/process.py --docs docs --out build

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: docs-pdf
          path: build/pdf/*.pdf
          if-no-files-found: error

      - name: Upload PNGs
        uses: actions/upload-artifact@v4
        with:
          name: docs-png
          path: build/png/*.png
          if-no-files-found: warn

      # Upload des documents legal s'ils existent
      - name: Check and upload legal documents
        run: |
          if [ -d "docs/legal" ]; then
            echo "Legal directory found, checking for documents..."
            if ls docs/legal/*.pdf 2>/dev/null || ls docs/legal/*.docx 2>/dev/null; then
              echo "Legal documents found"
              # Créer un artifact pour les documents legal
              mkdir -p build/legal
              cp docs/legal/*.pdf build/legal/ 2>/dev/null || true
              cp docs/legal/*.docx build/legal/ 2>/dev/null || true
            else
              echo "No legal documents found"
            fi
          else
            echo "No legal directory found"
          fi

      - name: Upload legal documents
        uses: actions/upload-artifact@v4
        with:
          name: docs-legal
          path: build/legal/*
          if-no-files-found: ignore
  
  release:
    name: Publish GitHub Release (latest on main)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    steps:
      # Checkout pour avoir accès au repo (notamment docs/legal si nécessaire)
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download PDFs
        uses: actions/download-artifact@v4
        with:
          name: docs-pdf
          path: dist/pdf

      - name: Download PNGs
        uses: actions/download-artifact@v4
        with:
          name: docs-png
          path: dist/png

      # Télécharger les documents legal s'ils existent
      - name: Download legal documents
        uses: actions/download-artifact@v4
        with:
          name: docs-legal
          path: dist/legal
        continue-on-error: true  # Ne pas échouer si l'artifact n'existe pas

      # Supprimer COMPLÈTEMENT l'ancienne release/tag 'latest' avant recréation
      - name: Delete existing latest release completely
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Ne pas utiliser set -e pour gérer les erreurs manuellement
          
          # Supprimer la release 'latest' si elle existe (sans --cleanup-tag d'abord)
          echo "Checking for existing 'latest' release..."
          if gh release view latest >/dev/null 2>&1; then
            echo "Found existing release 'latest', deleting..."
            gh release delete latest -y || echo "Warning: Could not delete release"
          else
            echo "No existing 'latest' release found."
          fi
          
          # Attendre un peu pour s'assurer que GitHub a bien traité la suppression
          sleep 2
          
          # Supprimer le tag 'latest' séparément s'il existe
          echo "Checking for existing 'latest' tag..."
          if git ls-remote --tags origin | grep -q "refs/tags/latest"; then
            echo "Found existing tag 'latest', deleting..."
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPO}/git/refs/tags/latest" || echo "Warning: Could not delete tag"
          else
            echo "No existing 'latest' tag found."
          fi
          
          # Alternative pour supprimer le tag via git
          git push origin :refs/tags/latest 2>/dev/null || true
          
          echo "Cleanup complete, ready to create new release."

      # Préparer tous les assets dans un seul répertoire pour éviter les doublons
      - name: Prepare all assets
        run: |
          set -euo pipefail
          
          # Créer un répertoire pour tous les assets
          mkdir -p release-assets
          
          # Copier les PDFs générés
          if [ -d "dist/pdf" ] && ls dist/pdf/*.pdf >/dev/null 2>&1; then
            echo "Copying PDF files..."
            cp dist/pdf/*.pdf release-assets/
          fi
          
          # Copier les PNGs générés
          if [ -d "dist/png" ] && ls dist/png/*.png >/dev/null 2>&1; then
            echo "Copying PNG files..."
            cp dist/png/*.png release-assets/
          fi
          
          # Copier les documents legal depuis l'artifact téléchargé
          if [ -d "dist/legal" ] && ls dist/legal/* >/dev/null 2>&1; then
            echo "Copying legal documents from artifact..."
            cp dist/legal/* release-assets/ 2>/dev/null || true
          fi
          
          # Ou copier directement depuis docs/legal si présent dans le checkout
          if [ -d "docs/legal" ]; then
            echo "Checking for legal documents in repo..."
            if ls docs/legal/*.pdf >/dev/null 2>&1; then
              for f in docs/legal/*.pdf; do
                bn=$(basename "$f")
                if [ ! -f "release-assets/$bn" ]; then
                  echo "Adding legal PDF: $bn"
                  cp "$f" release-assets/
                fi
              done
            fi
            if ls docs/legal/*.docx >/dev/null 2>&1; then
              for f in docs/legal/*.docx; do
                bn=$(basename "$f")
                if [ ! -f "release-assets/$bn" ]; then
                  echo "Adding legal DOCX: $bn"
                  cp "$f" release-assets/
                fi
              done
            fi
          fi
          
          # Lister tous les fichiers pour vérification
          echo ""
          echo "=== All assets to be uploaded ==="
          ls -la release-assets/
          echo "Total files: $(ls -1 release-assets/ | wc -l)"

          # ✅ Génère une description orientée utilisateur final et métier
      - name: Build release body
        run: |
          set -euo pipefail
          
          # Fonction pour extraire le nom propre d'un fichier
          extract_name() {
            basename "$1" | sed 's/\.pdf$//' | sed 's/\.png$//' | sed 's/_mermaid.*$//'
          }
          
          {
            echo "# 📚 Documentation Solutions Industrielles - Clauger 3E"
            echo
            echo "> **Guide rapide** : Téléchargez directement les PDF correspondant à votre besoin en cliquant sur les fichiers ci-dessous"
            echo
            echo "---"
            echo
            echo "## 🎯 Trouvez rapidement votre documentation"
            echo
            echo "### 🔌 **J'ai besoin de connecter des équipements à distance**"
            echo "→ _Pour télémaintenance, modification de programmes automates, supervision_"
            echo
            echo "### 📊 **J'ai besoin de collecter des données terrain**"
            echo "→ _Pour monitoring énergétique, suivi de production, IoT industriel_"
            echo
            echo "### 🎮 **J'ai besoin de piloter des équipements**"
            echo "→ _Pour contrôle à distance, automatisation, gestion temps réel_"
            echo
            echo "---"
            echo
            
            # Section Accès distant
            echo "## 🔌 Solutions d'Accès Distant"
            echo "_Permettre aux techniciens et automaticiens d'intervenir à distance sur vos installations_"
            echo
            if ls release-assets/*"Accès distant"*.pdf >/dev/null 2>&1; then
              echo "| Document | Description | Cas d'usage |"
              echo "|----------|-------------|-------------|"
              
              # HMS Ewon Talk2M
              if ls release-assets/*"HMS Ewon Talk2M"*.pdf >/dev/null 2>&1; then
                echo "| **HMS Ewon Talk2M** | Plateforme VPN industrielle avec passerelles Ewon Flexy/Cosy | ✓ Accès sécurisé aux automates<br>✓ Modification programmes API<br>✓ Visualisation IHM/SCADA<br>✓ Multi-sites, multi-utilisateurs |"
              fi
              
              # VPN Client
              if ls release-assets/*"Solution VPN client"*.pdf >/dev/null 2>&1; then
                echo "| **Solution VPN client** | Connexion VPN directe site-à-site ou nomade | ✓ Accès direct au réseau client<br>✓ Utilisation outils métier<br>✓ Interventions ponctuelles |"
              fi
              
              # Prise de main à distance
              if ls release-assets/*"Prise de main à distance"*.pdf >/dev/null 2>&1; then
                echo "| **Prise de main à distance** | Solutions TeamViewer, AnyDesk avec poste de rebond | ✓ Support rapide<br>✓ Formation utilisateur<br>✓ Diagnostic sans VPN |"
              fi
            else
              echo "_Aucune documentation d'accès distant disponible._"
            fi
            echo
            
            # Section Collecte de données
            echo "## 📊 Solutions de Collecte de Données"
            echo "_Remonter et centraliser vos données industrielles vers MyPortal3E_"
            echo
            if ls release-assets/*"Collecte de données"*.pdf >/dev/null 2>&1; then
              
              # Énergies
              echo "### ⚡ **Données Énergétiques**"
              echo "| Document | Description | Points clés |"
              echo "|----------|-------------|------------|"
              
              if ls release-assets/*"API GRDF"*.pdf >/dev/null 2>&1; then
                echo "| **API GRDF ADICT** | Collecte consommations gaz via API GRDF | ✓ Données certifiées distributeur<br>✓ Historique 3-5 ans<br>✓ Courbes de charge |"
              fi
              
              if ls release-assets/*"Enedis SGE"*.pdf >/dev/null 2>&1; then
                echo "| **ENEDIS SGE** | Collecte consommations électriques Linky Pro | ✓ Index et courbes de charge<br>✓ Pas 10 min à 1h<br>✓ Données J+1 |"
              fi
              echo
              
              # IoT
              echo "### 📡 **Solutions IoT Sans Fil**"
              echo "| Document | Description | Points clés |"
              echo "|----------|-------------|------------|"
              
              if ls release-assets/*"LoRaWAN public"*.pdf >/dev/null 2>&1; then
                echo "| **LoRaWAN public** | Réseau Orange LiveObjects | ✓ Couverture nationale<br>✓ Capteurs batterie<br>✓ Coût mensuel/capteur |"
              fi
              
              if ls release-assets/*"LoRaWAN privé"*.pdf >/dev/null 2>&1; then
                echo "| **LoRaWAN privé** | Gateway LoRa sur site | ✓ Infrastructure privée<br>✓ Pas d'abonnement<br>✓ Contrôle total |"
              fi
              echo
              
              # Industriel
              echo "### 🏭 **Solutions Industrielles**"
              echo "| Document | Description | Protocoles/Équipements |"
              echo "|----------|-------------|------------------------|"
              
              if ls release-assets/*"Datalogger"*.pdf >/dev/null 2>&1; then
                echo "| **Datalogger** | Passerelle Ewon Flexy en mode collecte | ✓ Modbus TCP/RTU<br>✓ Siemens S7<br>✓ Allen Bradley<br>✓ BACnet |"
              fi
              
              if ls release-assets/*"MCD"*.pdf >/dev/null 2>&1; then
                echo "| **MCD (MyClaugerDetect)** | PC industriel Linux conteneurisé | ✓ Multi-protocoles<br>✓ Edge computing<br>✓ Traitement local<br>✓ MQTTS vers cloud |"
              fi
              
              if ls release-assets/*"SCADA SFTP"*.pdf >/dev/null 2>&1; then
                echo "| **SCADA SFTP** | Export depuis supervision existante | ✓ Compatible tout SCADA<br>✓ Export CSV planifié<br>✓ Script PowerShell |"
              fi
              
              if ls release-assets/*"Echange par SFTP"*.pdf >/dev/null 2>&1; then
                echo "| **Échange par SFTP** | Transfert de fichiers sécurisé | ✓ Import/Export CSV<br>✓ Bidirectionnel<br>✓ Planning flexible |"
              fi
            else
              echo "_Aucune documentation de collecte disponible._"
            fi
            echo
            
            # Section Pilotage distant
            echo "## 🎮 Solutions de Pilotage Distant"
            echo "_Contrôler et automatiser vos équipements à distance_"
            echo
            if ls release-assets/*"Pilotage"*.pdf >/dev/null 2>&1; then
              echo "| Document | Description | Fonctionnalités |"
              echo "|----------|-------------|-----------------|"
              for f in release-assets/*"Pilotage"*.pdf; do
                name=$(extract_name "$f" | sed 's/Pilotage distant - //')
                echo "| **$name** | Plateforme de pilotage temps réel via MyPortal3E | ✓ Contrôle-commande distant<br>✓ Scénarios automatisés<br>✓ Interface web responsive<br>✓ Historisation commandes |"
              done
            else
              echo "_Aucune documentation de pilotage disponible._"
            fi
            echo
            
            # Section Documents légaux
            if ls release-assets/*.docx >/dev/null 2>&1 || ls release-assets/*onsentement*.pdf >/dev/null 2>&1; then
              echo "---"
              echo
              echo "## 📋 Documents Contractuels et Modèles"
              echo "_Formulaires de consentement et documents légaux pour vos clients_"
              echo
              echo "| Document | Type | Usage |"
              echo "|----------|------|-------|"
              
              if ls release-assets/*ENEDIS*.docx >/dev/null 2>&1 || ls release-assets/*ENEDIS*.pdf >/dev/null 2>&1; then
                echo "| **Modèle consentement ENEDIS** | Word/PDF | Autorisation client pour collecte données électriques |"
              fi
              
              if ls release-assets/*GRDF*.docx >/dev/null 2>&1 || ls release-assets/*GRDF*.pdf >/dev/null 2>&1; then
                echo "| **Modèle consentement GRDF** | Word/PDF | Autorisation client pour collecte données gaz |"
              fi
              
              if ls release-assets/*"Formulaire type"*.pdf >/dev/null 2>&1; then
                echo "| **Formulaire type unifié** | PDF | Consentement multi-énergies (gaz + élec) |"
              fi
              echo
            fi
            
            # Informations pratiques
            echo "---"
            echo
            echo "## 🔧 Compatibilités Techniques"
            echo
            echo "### Automates supportés"
            echo "- **Siemens** : S7-300/400/1200/1500 (ISO on TCP, S7 Protocol)"
            echo "- **Schneider** : M340, M580, Premium (Modbus TCP)"
            echo "- **Allen Bradley** : ControlLogix, CompactLogix (EtherNet/IP)"
            echo "- **Omron** : CJ/CS/NJ/NX Series (FINS, EtherNet/IP)"
            echo "- **Autres** : Tout automate Modbus TCP/RTU, OPC UA, BACnet"
            echo
            echo "### Passerelles et équipements"
            echo "- **HMS Networks** : Ewon Flexy 205, Ewon Cosy 131"
            echo "- **Secomea** : SiteManager, GateManager"
            echo "- **Capteurs IoT** : LoRaWAN classe A/C, Sigfox"
            echo "- **Compteurs** : Linky Pro (Enedis), Gazpar (GRDF)"
            echo
            echo "### Protocoles de communication"
            echo "- **Terrain** : Modbus TCP/RTU, S7, OPC UA, BACnet, MQTT, DNP3, IEC 104"
            echo "- **Cloud** : HTTPS REST API, MQTTS, WebSocket over TLS, SFTP"
            echo
            echo "---"
            echo
            echo "## 💡 Comment utiliser cette documentation ?"
            echo
            echo "1. **Identifiez votre besoin** dans les sections ci-dessus"
            echo "2. **Téléchargez le(s) PDF** correspondant(s)"
            echo "3. **Consultez les diagrammes PNG** pour vos présentations"
            echo "4. **Utilisez les modèles Word** pour vos contrats clients"
            echo
            echo "### 📞 Support technique"
            echo "- **Hotline** : Support Clauger 3E"
            echo "- **Email** : assistantes_3E@clauger.fr"
            echo "- **Expertise** : Automatisme, IoT, cybersécurité OT"
            echo
            
            # Diagrammes disponibles (repliable)
            if ls release-assets/*.png >/dev/null 2>&1; then
              echo "---"
              echo
              echo "## 🖼️ Diagrammes d'Architecture"
              echo
              echo "<details>"
              echo "<summary>📐 Voir tous les schémas techniques disponibles (PNG)</summary>"
              echo
              echo "### Schémas disponibles pour vos présentations :"
              for f in release-assets/*.png; do
                name=$(extract_name "$f")
                echo "- $name"
              done
              echo
              echo "</details>"
              echo
            fi
            
            echo "---"
            echo
            echo "## 🏷️ Mots-clés pour recherche rapide"
            echo
            echo "_VPN, Ewon, Talk2M, Secomea, télémaintenance, accès distant, SCADA, IoT, LoRaWAN, Modbus, Siemens S7, Allen Bradley, collecte données, monitoring, ENEDIS, GRDF, Linky, API, MQTT, MyPortal3E, MCD, datalogger, pilotage, automatisme, OT, cybersécurité, IEC 62443, NIS2_"
            echo
            echo "---"
            echo
            echo "_📅 Documentation mise à jour le $(date '+%d/%m/%Y à %H:%M') UTC_"
            echo "_🔒 Solutions certifiées ISO 27001 - Conformité IEC 62443 & NIS2_"
            echo "_🏢 © Clauger 3E - Solutions d'automatisme industriel secure by design_"
          } > release-body.md

      # ✅ Crée la nouvelle Release 'latest' avec tous les assets
      - name: Create rolling release (latest) with assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest docs (main)
          prerelease: false
          generate_release_notes: false  # Désactivé car on a notre propre body
          body_path: release-body.md
          files: release-assets/*
          fail_on_unmatched_files: false  # Important : ne pas échouer si un pattern ne matche pas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job optionnel pour les releases versionnées (tags v*)
  release-version:
    name: Publish versioned release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download PDFs
        uses: actions/download-artifact@v4
        with:
          name: docs-pdf
          path: dist/pdf

      - name: Download PNGs
        uses: actions/download-artifact@v4
        with:
          name: docs-png
          path: dist/png

      - name: Download legal documents
        uses: actions/download-artifact@v4
        with:
          name: docs-legal
          path: dist/legal
        continue-on-error: true

      # Préparer tous les assets
      - name: Prepare all assets
        run: |
          mkdir -p release-assets
          cp dist/pdf/*.pdf release-assets/ 2>/dev/null || true
          cp dist/png/*.png release-assets/ 2>/dev/null || true
          cp dist/legal/* release-assets/ 2>/dev/null || true
          
          # Ajouter les documents depuis docs/legal si présents
          if [ -d "docs/legal" ]; then
            cp docs/legal/*.pdf release-assets/ 2>/dev/null || true
            cp docs/legal/*.docx release-assets/ 2>/dev/null || true
          fi

      - name: Create versioned release
        uses: softprops/action-gh-release@v2
        with:
          name: Documentation ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}