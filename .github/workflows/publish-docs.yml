name: Build & Publish Docs

on:
  push:
    branches: [ "main" ]
    tags:     [ "v*" ]           # tag v1.2.3 => release
  workflow_dispatch:

concurrency:
  group: publish-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build PDFs & PNGs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pandoc + TeX Live pour LuaLaTeX
      - name: Install Pandoc & TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-luatex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra \
            texlive-plain-generic lmodern

      # Python pour exécuter scripts/process.py
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f scripts/requirements.txt ]; then
            python -m pip install -r scripts/requirements.txt
          else
            python -m pip install requests
          fi

      - name: Build (PNG + PDF)
        run: |
          python scripts/process.py --docs docs --out build

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: docs-pdf
          path: build/pdf/*.pdf
          if-no-files-found: error

      - name: Upload PNGs
        uses: actions/upload-artifact@v4
        with:
          name: docs-png
          path: build/png/*.png
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download PDFs
        uses: actions/download-artifact@v4
        with:
          name: docs-pdf
          path: dist/pdf

      - name: Download PNGs
        uses: actions/download-artifact@v4
        with:
          name: docs-png
          path: dist/png

      - name: Package archives
        run: |
          tar -czf docs-pdf.tar.gz -C dist/pdf .
          tar -czf diagrams-png.tar.gz -C dist/png . || true

      - name: Create/Update Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            docs-pdf.tar.gz
            diagrams-png.tar.gz
            dist/pdf/*.pdf
