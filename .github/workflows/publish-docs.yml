name: Build & Release diagrams

on:
  push:
    branches:
      - main
      - draft

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Mermaid CLI
        run: |
          npm i -g @mermaid-js/mermaid-cli@10
          sudo apt-get update
          sudo apt-get install -y fonts-noto fonts-noto-color-emoji fonts-emojione

      - name: Prepare folders
        run: |
          mkdir -p build/md_processed
          mkdir -p exports/png
          mkdir -p scripts

      - name: Create Puppeteer config
        run: |
          cat > scripts/puppeteer.json << 'JSON'
          {
            "args": ["--no-sandbox", "--disable-setuid-sandbox", "--font-render-hinting=none"]
          }
          JSON

      - name: Add extractor script
        shell: bash
        run: |
          cat > scripts/extract_mermaid_and_replace.py << 'PY'
          import re
          import os
          import sys
          import subprocess
          import pathlib

          SRC_DIRS = ["docs", "."]
          PNG_DIR = pathlib.Path("exports/png")
          OUT_DIR = pathlib.Path("build/md_processed")

          # Pattern pour détecter les blocs mermaid - CORRIGÉ
          mermaid_block = re.compile(r'^```mermaid\s*\n(.*?)\n```', re.MULTILINE | re.DOTALL)

          def render_mermaid_to_png(mmd_text, out_png):
              """Convertit un bloc Mermaid en PNG avec emojis"""
              tmp_mmd = out_png.with_suffix(".mmd")
              print(f"  Rendering: {out_png.name}")
              
              # Garder les emojis dans le diagramme
              tmp_mmd.write_text(mmd_text, encoding="utf-8")
              
              try:
                  # Utiliser mmdc avec timeout et config
                  result = subprocess.run(
                      ["mmdc", "-i", str(tmp_mmd), "-o", str(out_png), 
                       "--puppeteerConfigFile", "scripts/puppeteer.json",
                       "--theme", "default",
                       "--width", "1200",
                       "--height", "800"],
                      capture_output=True,
                      text=True,
                      timeout=60
                  )
                  
                  if result.returncode != 0:
                      print(f"    Warning: {result.stderr}")
                      # Essai sans config
                      subprocess.run(
                          ["mmdc", "-i", str(tmp_mmd), "-o", str(out_png)],
                          timeout=60
                      )
                  
                  if out_png.exists():
                      size = out_png.stat().st_size
                      print(f"    ✓ Created: {out_png.name} ({size} bytes)")
                  else:
                      print(f"    ✗ Failed to create PNG")
                      
              except subprocess.TimeoutExpired:
                  print(f"    ✗ Timeout while rendering")
              except Exception as e:
                  print(f"    ✗ Error: {e}")
              finally:
                  tmp_mmd.unlink(missing_ok=True)

          def process_md(md_path):
              """Traite un fichier Markdown"""
              rel = pathlib.Path(md_path).relative_to(".")
              print(f"\nProcessing: {rel}")
              
              text = pathlib.Path(md_path).read_text(encoding="utf-8")
              
              # Debug: afficher les premiers caractères
              print(f"  File size: {len(text)} chars")
              if "mermaid" in text.lower():
                  print(f"  ✓ Contains 'mermaid' keyword")
              
              # Chercher les blocs mermaid
              matches = list(mermaid_block.finditer(text))
              print(f"  Found {len(matches)} mermaid blocks")
              
              if matches:
                  first_block = matches[0].group(1)[:50]
                  print(f"  First block preview: {first_block}...")
              
              idx = 0
              def repl(match):
                  nonlocal idx
                  code = match.group(1).strip()
                  
                  stem = rel.as_posix().replace("/", "_").replace(".md", "")
                  png_name = f"{stem}_m{idx}.png"
                  out_png = PNG_DIR / png_name
                  
                  out_png.parent.mkdir(parents=True, exist_ok=True)
                  render_mermaid_to_png(code, out_png)
                  idx += 1
                  
                  # Chemin relatif correct pour pandoc
                  return f"![Diagram {idx}](exports/png/{png_name})"

              # Remplacer les blocs mermaid
              new_text = mermaid_block.sub(repl, text)
              
              if idx > 0:
                  print(f"  ✓ Replaced {idx} mermaid blocks")
              
              # Écrire le fichier avec emojis préservés
              out_file = OUT_DIR / rel
              out_file.parent.mkdir(parents=True, exist_ok=True)
              out_file.write_text(new_text, encoding="utf-8")
              print(f"  Wrote: {out_file}")

          def main():
              print("=== Mermaid to PNG Converter ===")
              
              # Vérifier mmdc
              try:
                  result = subprocess.run(["mmdc", "--version"], capture_output=True, text=True)
                  print(f"Mermaid CLI: {result.stdout.strip()}")
              except:
                  print("ERROR: mmdc not found!")
                  sys.exit(1)
              
              # Lister les fichiers MD
              md_files = []
              for root in SRC_DIRS:
                  if pathlib.Path(root).exists():
                      for p in pathlib.Path(root).rglob("*.md"):
                          if not str(p).startswith("build/"):
                              md_files.append(str(p))
              
              print(f"Found {len(md_files)} markdown files")
              
              # Traiter chaque fichier
              for md_file in md_files:
                  process_md(md_file)
              
              # Résultats
              png_files = list(PNG_DIR.glob("*.png"))
              print(f"\n=== Results ===")
              print(f"Generated {len(png_files)} PNG files")
              
              if png_files:
                  for png in png_files[:5]:
                      print(f"  - {png.name} ({png.stat().st_size} bytes)")

          if __name__ == "__main__":
              main()
          PY

      - name: Extract Mermaid blocks to PNG
        run: |
          echo "=== Extraction Mermaid ==="
          python3 scripts/extract_mermaid_and_replace.py
          echo ""
          echo "=== PNG générés ==="
          ls -la exports/png/ 2>/dev/null || echo "Pas de PNG"

      - name: Install pandoc and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-latex-base \
            texlive-fonts-recommended \
            texlive-latex-extra \
            fonts-noto \
            fonts-noto-color-emoji \
            fonts-emojione \
            fonts-dejavu \
            python3-pip
          pip3 install weasyprint

      - name: Build PDF with emojis
        run: |
          # Créer le fichier consolidé
          python3 << 'PY'
          import pathlib
          import shutil
          from pathlib import Path
          
          consolidated = Path("build/Consolidated.md")
          header = "# Network Architectures - Remote Access 🌐🔒\n\n"
          consolidated.write_text(header, encoding="utf-8")
          
          md_files = sorted(Path("build/md_processed").rglob("*.md"))
          
          if md_files:
              print(f"Consolidating {len(md_files)} files...")
              for md_file in md_files:
                  print(f"  Adding: {md_file}")
                  with open(consolidated, "a", encoding="utf-8") as out:
                      out.write("\n\n---\n\n")
                      content = md_file.read_text(encoding="utf-8")
                      out.write(content)
          
          # Copier les PNG
          png_source = Path("exports/png")
          png_dest = Path("build/exports/png")
          
          if png_source.exists() and any(png_source.glob("*.png")):
              png_dest.mkdir(parents=True, exist_ok=True)
              for png in png_source.glob("*.png"):
                  shutil.copy2(png, png_dest / png.name)
              print(f"Copied {len(list(png_source.glob('*.png')))} PNG files")
          PY
          
          cd build
          
          # Option 1: XeLaTeX (meilleur support emoji)
          echo "=== Génération PDF avec XeLaTeX ==="
          pandoc Consolidated.md -o Remote-Access-Architectures.pdf \
            --pdf-engine=xelatex \
            --variable geometry:margin=1in \
            --variable fontsize=11pt \
            --variable mainfont="Noto Sans" \
            --variable monofont="Noto Sans Mono" \
            --variable colorlinks=true \
            --highlight-style=tango 2>&1 || {
              
              # Option 2: Weasyprint si XeLaTeX échoue
              echo "XeLaTeX failed, trying weasyprint..."
              
              # Créer HTML avec CSS pour emojis
              cat > emoji.css << 'CSS'
          @import url('https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap');
          body { 
            font-family: 'Noto Sans', 'Noto Color Emoji', sans-serif;
            max-width: 900px;
            margin: auto;
            padding: 20px;
          }
          img { max-width: 100%; height: auto; }
          pre { background: #f4f4f4; padding: 10px; overflow-x: auto; }
          code { background: #f4f4f4; padding: 2px 4px; }
          CSS
              
              pandoc Consolidated.md -o Consolidated.html \
                --standalone \
                --metadata title="Network Architectures" \
                --css emoji.css
              
              # HTML vers PDF avec weasyprint
              weasyprint Consolidated.html Remote-Access-Architectures.pdf || {
                echo "Creating fallback PDF..."
                echo "# Documentation" > fallback.md
                echo "Build failed - check artifacts" >> fallback.md
                pandoc fallback.md -o Remote-Access-Architectures.pdf 2>/dev/null || true
              }
          }
          
          if [ -f "Remote-Access-Architectures.pdf" ]; then
            echo "✓ PDF créé avec succès!"
            ls -lh Remote-Access-Architectures.pdf
          fi

      - name: Zip PNG exports
        run: |
          if [ -d "exports/png" ] && [ "$(ls -A exports/png)" ]; then
            cd exports
            zip -r ../build/diagrams-png.zip png
            cd ..
            echo "✓ ZIP créé avec les PNG"
          else
            mkdir -p exports/png
            echo "Aucun diagramme généré - vérifiez vos blocs Mermaid" > exports/png/README.txt
            cd exports
            zip -r ../build/diagrams-png.zip png
            cd ..
          fi

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Documentation Build #${{ github.run_number }} - ${{ steps.date.outputs.date }}"
          draft: false
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          body: |
            ## 📚 Documentation Release
            
            **Build:** #${{ github.run_number }}
            **Date:** ${{ steps.date.outputs.date }}
            **Branch:** ${{ github.ref_name }}
            
            ### 📦 Artifacts
            - `Remote-Access-Architectures.pdf` - Documentation avec emojis 💻🌐
            - `diagrams-png.zip` - Diagrammes Mermaid en PNG
          files: |
            build/Remote-Access-Architectures.pdf
            build/diagrams-png.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}