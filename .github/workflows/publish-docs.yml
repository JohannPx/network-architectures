name: Build & Release diagrams

on:
  push:
    branches:
      - main
      - draft

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          # Installer Mermaid CLI avec version fixe
          npm i -g @mermaid-js/mermaid-cli@10.9.1
          
          # Installer les dépendances système
          sudo apt-get update
          sudo apt-get install -y \
            chromium-browser \
            fonts-noto \
            fonts-noto-color-emoji \
            fonts-emojione \
            pandoc \
            texlive-xetex \
            texlive-latex-base \
            texlive-fonts-recommended \
            texlive-latex-extra \
            fonts-dejavu \
            python3-pip
          
          pip3 install weasyprint
          
          # Définir Chrome pour puppeteer
          export PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
          export PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser

      - name: Prepare folders
        run: |
          mkdir -p build/pdfs
          mkdir -p build/md_processed
          mkdir -p exports/png
          mkdir -p scripts

      - name: Create Puppeteer config with aggressive sandbox disable
        run: |
          cat > scripts/puppeteer.json << 'JSON'
          {
            "executablePath": "/usr/bin/chromium-browser",
            "args": [
              "--no-sandbox",
              "--disable-setuid-sandbox",
              "--disable-dev-shm-usage",
              "--disable-gpu",
              "--no-first-run",
              "--no-zygote",
              "--single-process",
              "--disable-extensions"
            ]
          }
          JSON

      - name: Add extractor script
        shell: bash
        run: |
          cat > scripts/extract_mermaid_and_replace.py << 'PY'
          import re
          import os
          import sys
          import subprocess
          import pathlib
          import time

          # Traiter SEULEMENT les fichiers sous docs/
          SRC_DIR = pathlib.Path("docs")
          PNG_DIR = pathlib.Path("exports/png")
          OUT_DIR = pathlib.Path("build/md_processed")

          # Pattern pour détecter les blocs mermaid
          mermaid_block = re.compile(r'^```mermaid\s*\n(.*?)\n```', re.MULTILINE | re.DOTALL)

          def clean_mermaid_syntax(mmd_text):
              """Nettoie la syntaxe Mermaid non standard"""
              # Remplacer @{ shape: das } par syntaxe standard
              pattern = r'(\w+)@\{\s*shape:\s*das,\s*label:\s*"([^"]+)"\s*\}'
              mmd_text = re.sub(pattern, r'\1["\2"]', mmd_text)
              
              # Supprimer les animations non supportées
              mmd_text = re.sub(r'\w+@\{\s*animation:\s*\w+\s*\}', '', mmd_text)
              
              # Nettoyer les références d'animation  
              mmd_text = re.sub(r'(\w+)\s+e\d+@', r'\1 ', mmd_text)
              
              return mmd_text

          def render_mermaid_to_png(mmd_text, out_png, retry=3):
              """Convertit un bloc Mermaid en PNG avec retry"""
              tmp_mmd = out_png.with_suffix(".mmd")
              print(f"  Rendering: {out_png.name}")
              
              # Nettoyer la syntaxe
              mmd_clean = clean_mermaid_syntax(mmd_text)
              tmp_mmd.write_text(mmd_clean, encoding="utf-8")
              
              for attempt in range(retry):
                  try:
                      # Forcer l'utilisation de chromium avec no-sandbox
                      env = os.environ.copy()
                      env['PUPPETEER_EXECUTABLE_PATH'] = '/usr/bin/chromium-browser'
                      
                      result = subprocess.run(
                          ["mmdc", "-i", str(tmp_mmd), "-o", str(out_png),
                           "--puppeteerConfigFile", "scripts/puppeteer.json",
                           "--theme", "default",
                           "--width", "1200",
                           "--height", "800"],
                          capture_output=True,
                          text=True,
                          timeout=60,
                          env=env
                      )
                      
                      if result.returncode == 0 and out_png.exists():
                          size = out_png.stat().st_size
                          print(f"    ✓ Created: {out_png.name} ({size} bytes)")
                          break
                      elif attempt < retry - 1:
                          print(f"    Retry {attempt + 1}/{retry}...")
                          time.sleep(2)
                      else:
                          print(f"    ✗ Failed after {retry} attempts")
                          print(f"    Error: {result.stderr[:500]}")
                          
                  except Exception as e:
                      print(f"    ✗ Error: {e}")
                      if attempt < retry - 1:
                          time.sleep(2)
              
              tmp_mmd.unlink(missing_ok=True)

          def process_md(md_path):
              """Traite un fichier Markdown"""
              rel = md_path.relative_to(SRC_DIR)
              print(f"\nProcessing: docs/{rel}")
              
              text = md_path.read_text(encoding="utf-8")
              
              print(f"  File size: {len(text)} chars")
              
              # Chercher les blocs mermaid
              matches = list(mermaid_block.finditer(text))
              print(f"  Found {len(matches)} mermaid blocks")
              
              if matches:
                  first_block = matches[0].group(1)[:50]
                  print(f"  First block preview: {first_block}...")
              
              idx = 0
              def repl(match):
                  nonlocal idx
                  code = match.group(1).strip()
                  
                  # Nom unique pour le PNG
                  stem = str(rel).replace("/", "_").replace(".md", "")
                  png_name = f"docs_{stem}_m{idx}.png"
                  out_png = PNG_DIR / png_name
                  
                  out_png.parent.mkdir(parents=True, exist_ok=True)
                  render_mermaid_to_png(code, out_png)
                  idx += 1
                  
                  # Retourner l'image SANS "Figure X:"
                  return f"![](../../exports/png/{png_name})"

              # Remplacer les blocs mermaid
              new_text = mermaid_block.sub(repl, text)
              
              if idx > 0:
                  print(f"  ✓ Replaced {idx} mermaid blocks")
              
              # Sauvegarder avec structure de dossiers
              out_file = OUT_DIR / "docs" / rel
              out_file.parent.mkdir(parents=True, exist_ok=True)
              out_file.write_text(new_text, encoding="utf-8")
              print(f"  Wrote: {out_file}")
              
              return out_file

          def main():
              print("=== Mermaid to PNG Converter ===")
              
              # Vérifier mmdc
              try:
                  result = subprocess.run(["mmdc", "--version"], capture_output=True, text=True)
                  print(f"Mermaid CLI: {result.stdout.strip()}")
              except:
                  print("ERROR: mmdc not found!")
                  sys.exit(1)
              
              # Lister SEULEMENT les fichiers MD sous docs/
              if not SRC_DIR.exists():
                  print(f"ERROR: {SRC_DIR} directory not found!")
                  return []
              
              md_files = list(SRC_DIR.rglob("*.md"))
              print(f"Found {len(md_files)} markdown files under docs/")
              
              processed_files = []
              for md_file in md_files:
                  out_file = process_md(md_file)
                  if out_file:
                      processed_files.append(out_file)
              
              # Résultats
              png_files = list(PNG_DIR.glob("*.png"))
              print(f"\n=== Results ===")
              print(f"Generated {len(png_files)} PNG files")
              print(f"Processed {len(processed_files)} MD files")
              
              if png_files:
                  for png in png_files[:10]:
                      print(f"  - {png.name} ({png.stat().st_size} bytes)")
              
              # Retourner la liste des fichiers traités
              with open("build/processed_files.txt", "w") as f:
                  for pf in processed_files:
                      f.write(f"{pf}\n")

          if __name__ == "__main__":
              main()
          PY

      - name: Extract Mermaid blocks to PNG
        run: |
          echo "=== Extraction Mermaid ==="
          export PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
          python3 scripts/extract_mermaid_and_replace.py
          echo ""
          echo "=== PNG générés ==="
          ls -la exports/png/ 2>/dev/null || echo "Pas de PNG"

      - name: Generate individual PDFs with emojis
        run: |
          echo "=== Génération des PDF individuels ==="
          
          # Script pour générer un PDF par fichier MD
          python3 << 'PY'
          import pathlib
          import subprocess
          import shutil
          
          # Copier les PNG pour qu'ils soient accessibles
          png_source = pathlib.Path("exports/png")
          if png_source.exists():
              # Copier dans plusieurs emplacements pour être sûr
              for dest in ["build/exports/png", "exports/png"]:
                  dest_path = pathlib.Path(dest)
                  dest_path.mkdir(parents=True, exist_ok=True)
                  for png in png_source.glob("*.png"):
                      shutil.copy2(png, dest_path / png.name)
          
          # Lire la liste des fichiers traités
          processed_files = []
          if pathlib.Path("build/processed_files.txt").exists():
              with open("build/processed_files.txt", "r") as f:
                  processed_files = [pathlib.Path(line.strip()) for line in f if line.strip()]
          
          if not processed_files:
              # Si pas de liste, chercher tous les MD sous build/md_processed/docs
              md_dir = pathlib.Path("build/md_processed/docs")
              if md_dir.exists():
                  processed_files = list(md_dir.rglob("*.md"))
          
          print(f"Génération de {len(processed_files)} PDFs...")
          
          pdf_count = 0
          for md_file in processed_files:
              if not md_file.exists():
                  print(f"  Fichier non trouvé: {md_file}")
                  continue
              
              # Nom du PDF basé sur le chemin du MD
              rel_path = str(md_file).replace("build/md_processed/docs/", "")
              pdf_name = rel_path.replace("/", "_").replace(".md", ".pdf")
              pdf_path = pathlib.Path("build/pdfs") / pdf_name
              
              print(f"\n  Génération: {pdf_name}")
              
              # Créer un fichier temporaire avec les images correctement référencées
              temp_md = pathlib.Path("build/temp.md")
              content = md_file.read_text(encoding="utf-8")
              
              # Ajuster les chemins des images selon l'emplacement
              content = content.replace("../../exports/png/", "exports/png/")
              content = content.replace("../exports/png/", "exports/png/")
              
              temp_md.write_text(content, encoding="utf-8")
              
              # Générer le PDF avec XeLaTeX pour les emojis
              try:
                  result = subprocess.run(
                      ["pandoc", str(temp_md), "-o", str(pdf_path),
                       "--pdf-engine=xelatex",
                       "--variable", "geometry:margin=1in",
                       "--variable", "fontsize=11pt",
                       "--variable", "mainfont=Noto Sans",
                       "--variable", "monofont=DejaVu Sans Mono",
                       "--variable", "colorlinks=true",
                       "--highlight-style=tango"],
                      capture_output=True,
                      text=True,
                      cwd="build"
                  )
                  
                  if result.returncode == 0 and pdf_path.exists():
                      print(f"    ✓ PDF créé: {pdf_path.name}")
                      pdf_count += 1
                  else:
                      print(f"    ✗ Échec XeLaTeX, essai avec weasyprint...")
                      
                      # Essayer avec weasyprint
                      html_path = pdf_path.with_suffix(".html")
                      subprocess.run(
                          ["pandoc", str(temp_md), "-o", str(html_path),
                           "--standalone",
                           "--metadata", "title=Documentation"],
                          cwd="build"
                      )
                      
                      if html_path.exists():
                          subprocess.run(
                              ["weasyprint", str(html_path), str(pdf_path)],
                              cwd="build"
                          )
                          if pdf_path.exists():
                              print(f"    ✓ PDF créé avec weasyprint")
                              pdf_count += 1
                      
              except Exception as e:
                  print(f"    ✗ Erreur: {e}")
              
              temp_md.unlink(missing_ok=True)
          
          print(f"\n=== Résultat: {pdf_count} PDFs générés ===")
          PY
          
          # Lister les PDFs créés
          echo ""
          echo "=== PDFs créés ==="
          ls -la build/pdfs/ 2>/dev/null || echo "Aucun PDF généré"

      - name: Create consolidated ZIP
        run: |
          cd build
          
          # Créer une archive avec tous les PDFs
          if [ -d "pdfs" ] && [ "$(ls -A pdfs)" ]; then
            zip -r documentation-pdfs.zip pdfs/
            echo "✓ Archive PDFs créée"
          else
            echo "Aucun PDF à archiver"
            echo "No PDFs generated" > pdfs/README.txt
            zip -r documentation-pdfs.zip pdfs/
          fi
          
          # Archive des PNGs
          if [ -d "../exports/png" ] && [ "$(ls -A ../exports/png)" ]; then
            cd ..
            zip -r build/diagrams-png.zip exports/png/
            echo "✓ Archive PNG créée"
          else
            cd ..
            mkdir -p exports/png
            echo "No diagrams generated" > exports/png/README.txt
            zip -r build/diagrams-png.zip exports/png/
          fi

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Documentation Build #${{ github.run_number }} - ${{ steps.date.outputs.date }}"
          draft: false
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          body: |
            ## 📚 Documentation Release
            
            **Build:** #${{ github.run_number }}
            **Date:** ${{ steps.date.outputs.date }}
            **Branch:** ${{ github.ref_name }}
            
            ### 📦 Artifacts
            - `documentation-pdfs.zip` - Tous les PDFs individuels avec emojis 
            - `diagrams-png.zip` - Diagrammes Mermaid en PNG
            
            ### 📄 PDFs générés
            Un PDF par fichier Markdown sous `/docs`
          files: |
            build/documentation-pdfs.zip
            build/diagrams-png.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}