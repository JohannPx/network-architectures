name: Release docs

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # (1) Install Pandoc + LaTeX
      - name: Install system deps (Pandoc + LaTeX)
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            lmodern

      # (2) Setup Python pour exécuter ton process.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      # (3) Build
      - name: Build PDFs & PNGs
        run: |
          python scripts/process.py --docs docs --out build
          ls -al build/pdf
          ls -al build/png

      # (4) Release
      - name: Publish release with assets (PDF + PNG + legal docs)
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest docs (main)
          allowUpdates: true
          generateReleaseNotes: false
          draft: false
          prerelease: false
          artifacts: |
            build/pdf/*.pdf,
            build/png/*.png,
            docs/legal/*.pdf,
            docs/legal/*.doc,
            docs/legal/*.docx
