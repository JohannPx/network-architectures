name: Build & Publish Docs

on:
  push:
    branches: [ "main" ]
    tags:     [ "v*" ]           # tag v1.2.3 => release
  workflow_dispatch:

concurrency:
  group: publish-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build PDFs & PNGs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pandoc + TeX Live pour LuaLaTeX
      - name: Install Pandoc & TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-luatex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra \
            texlive-plain-generic lmodern

      # Python pour exécuter scripts/process.py
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f scripts/requirements.txt ]; then
            python -m pip install -r scripts/requirements.txt
          else
            python -m pip install requests
          fi

      - name: Build (PNG + PDF)
        run: |
          python scripts/process.py --docs docs --out build

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: docs-pdf
          path: build/pdf/*.pdf
          if-no-files-found: error

      - name: Upload PNGs
        uses: actions/upload-artifact@v4
        with:
          name: docs-png
          path: build/png/*.png
          if-no-files-found: warn

      # Upload des documents legal s'ils existent
      - name: Check and upload legal documents
        run: |
          if [ -d "docs/legal" ]; then
            echo "Legal directory found, checking for documents..."
            if ls docs/legal/*.pdf 2>/dev/null || ls docs/legal/*.docx 2>/dev/null; then
              echo "Legal documents found"
              # Créer un artifact pour les documents legal
              mkdir -p build/legal
              cp docs/legal/*.pdf build/legal/ 2>/dev/null || true
              cp docs/legal/*.docx build/legal/ 2>/dev/null || true
            else
              echo "No legal documents found"
            fi
          else
            echo "No legal directory found"
          fi

      - name: Upload legal documents
        uses: actions/upload-artifact@v4
        with:
          name: docs-legal
          path: build/legal/*
          if-no-files-found: ignore
  
  release:
    name: Publish GitHub Release (latest on main)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    steps:
      # Checkout pour avoir accès au repo (notamment docs/legal si nécessaire)
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download PDFs
        uses: actions/download-artifact@v4
        with:
          name: docs-pdf
          path: dist/pdf

      - name: Download PNGs
        uses: actions/download-artifact@v4
        with:
          name: docs-png
          path: dist/png

      # Télécharger les documents legal s'ils existent
      - name: Download legal documents
        uses: actions/download-artifact@v4
        with:
          name: docs-legal
          path: dist/legal
        continue-on-error: true  # Ne pas échouer si l'artifact n'existe pas

      # Supprimer COMPLÈTEMENT l'ancienne release/tag 'latest' avant recréation
      - name: Delete existing latest release completely
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Ne pas utiliser set -e pour gérer les erreurs manuellement
          
          # Supprimer la release 'latest' si elle existe (sans --cleanup-tag d'abord)
          echo "Checking for existing 'latest' release..."
          if gh release view latest >/dev/null 2>&1; then
            echo "Found existing release 'latest', deleting..."
            gh release delete latest -y || echo "Warning: Could not delete release"
          else
            echo "No existing 'latest' release found."
          fi
          
          # Attendre un peu pour s'assurer que GitHub a bien traité la suppression
          sleep 2
          
          # Supprimer le tag 'latest' séparément s'il existe
          echo "Checking for existing 'latest' tag..."
          if git ls-remote --tags origin | grep -q "refs/tags/latest"; then
            echo "Found existing tag 'latest', deleting..."
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPO}/git/refs/tags/latest" || echo "Warning: Could not delete tag"
          else
            echo "No existing 'latest' tag found."
          fi
          
          # Alternative pour supprimer le tag via git
          git push origin :refs/tags/latest 2>/dev/null || true
          
          echo "Cleanup complete, ready to create new release."

      # Préparer tous les assets dans un seul répertoire pour éviter les doublons
      - name: Prepare all assets
        run: |
          set -euo pipefail
          
          # Créer un répertoire pour tous les assets
          mkdir -p release-assets
          
          # Copier les PDFs générés
          if [ -d "dist/pdf" ] && ls dist/pdf/*.pdf >/dev/null 2>&1; then
            echo "Copying PDF files..."
            cp dist/pdf/*.pdf release-assets/
          fi
          
          # Copier les PNGs générés
          if [ -d "dist/png" ] && ls dist/png/*.png >/dev/null 2>&1; then
            echo "Copying PNG files..."
            cp dist/png/*.png release-assets/
          fi
          
          # Copier les documents legal depuis l'artifact téléchargé
          if [ -d "dist/legal" ] && ls dist/legal/* >/dev/null 2>&1; then
            echo "Copying legal documents from artifact..."
            cp dist/legal/* release-assets/ 2>/dev/null || true
          fi
          
          # Ou copier directement depuis docs/legal si présent dans le checkout
          if [ -d "docs/legal" ]; then
            echo "Checking for legal documents in repo..."
            if ls docs/legal/*.pdf >/dev/null 2>&1; then
              for f in docs/legal/*.pdf; do
                bn=$(basename "$f")
                if [ ! -f "release-assets/$bn" ]; then
                  echo "Adding legal PDF: $bn"
                  cp "$f" release-assets/
                fi
              done
            fi
            if ls docs/legal/*.docx >/dev/null 2>&1; then
              for f in docs/legal/*.docx; do
                bn=$(basename "$f")
                if [ ! -f "release-assets/$bn" ]; then
                  echo "Adding legal DOCX: $bn"
                  cp "$f" release-assets/
                fi
              done
            fi
          fi
          
          # Lister tous les fichiers pour vérification
          echo ""
          echo "=== All assets to be uploaded ==="
          ls -la release-assets/
          echo "Total files: $(ls -1 release-assets/ | wc -l)"

      # ✅ Génère une description lisible de la Release
      - name: Build release body
        run: |
          set -euo pipefail
          {
            echo "# Documentation – build sur main"
            echo
            echo "Cette Release *latest* contient les documents générés automatiquement à partir de \`docs/\` :"
            echo
            echo "## PDF disponibles"
            if ls release-assets/*.pdf >/dev/null 2>&1; then
              for f in release-assets/*.pdf; do
                bn=$(basename "$f")
                echo "- $bn"
              done
            else
              echo "_Aucun PDF généré._"
            fi
            echo
            echo "## PNG disponibles (diagrammes Mermaid)"
            if ls release-assets/*.png >/dev/null 2>&1; then
              for f in release-assets/*.png; do
                bn=$(basename "$f")
                echo "- $bn"
              done
            else
              echo "_Aucun PNG généré._"
            fi
            echo
            echo "## Documents Word"
            if ls release-assets/*.docx >/dev/null 2>&1; then
              for f in release-assets/*.docx; do
                bn=$(basename "$f")
                echo "- $bn"
              done
            else
              echo "_Aucun document Word._"
            fi
            echo
            echo "## Utilisation"
            echo "- Téléchargez directement les **PDF individuels** pour diffusion."
            echo "- Les **PNG** sont les diagrammes Mermaid extraits et convertis."
            echo "- Les documents légaux sont inclus s'ils sont présents dans \`docs/legal/\`."
            echo
            echo "> 💡 Astuce : pour une version figée, publiez un tag \`vX.Y.Z\` – une Release correspondante sera créée avec les mêmes assets."
            echo
            echo "_Build automatique : $(date '+%Y-%m-%d %H:%M:%S UTC')_"
          } > release-body.md

      # ✅ Crée la nouvelle Release 'latest' avec tous les assets
      - name: Create rolling release (latest) with assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest docs (main)
          prerelease: false
          generate_release_notes: false  # Désactivé car on a notre propre body
          body_path: release-body.md
          files: release-assets/*
          fail_on_unmatched_files: false  # Important : ne pas échouer si un pattern ne matche pas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job optionnel pour les releases versionnées (tags v*)
  release-version:
    name: Publish versioned release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download PDFs
        uses: actions/download-artifact@v4
        with:
          name: docs-pdf
          path: dist/pdf

      - name: Download PNGs
        uses: actions/download-artifact@v4
        with:
          name: docs-png
          path: dist/png

      - name: Download legal documents
        uses: actions/download-artifact@v4
        with:
          name: docs-legal
          path: dist/legal
        continue-on-error: true

      # Préparer tous les assets
      - name: Prepare all assets
        run: |
          mkdir -p release-assets
          cp dist/pdf/*.pdf release-assets/ 2>/dev/null || true
          cp dist/png/*.png release-assets/ 2>/dev/null || true
          cp dist/legal/* release-assets/ 2>/dev/null || true
          
          # Ajouter les documents depuis docs/legal si présents
          if [ -d "docs/legal" ]; then
            cp docs/legal/*.pdf release-assets/ 2>/dev/null || true
            cp docs/legal/*.docx release-assets/ 2>/dev/null || true
          fi

      - name: Create versioned release
        uses: softprops/action-gh-release@v2
        with:
          name: Documentation ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}