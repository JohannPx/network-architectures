name: Build & Publish Docs

on:
  push:
    branches: [ "main" ]
    tags:     [ "v*" ]           # tag v1.2.3 => release
  workflow_dispatch:

concurrency:
  group: publish-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build PDFs & PNGs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pandoc + TeX Live pour LuaLaTeX
      - name: Install Pandoc & TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-luatex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra \
            texlive-plain-generic lmodern

      # Python pour exécuter scripts/process.py
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f scripts/requirements.txt ]; then
            python -m pip install -r scripts/requirements.txt
          else
            python -m pip install requests
          fi

      - name: Build (PNG + PDF)
        run: |
          python scripts/process.py --docs docs --out build

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: docs-pdf
          path: build/pdf/*.pdf
          if-no-files-found: error

      - name: Upload PNGs
        uses: actions/upload-artifact@v4
        with:
          name: docs-png
          path: build/png/*.png
          if-no-files-found: warn
  
  release:
    name: Publish GitHub Release (latest on main)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Download PDFs
        uses: actions/download-artifact@v4
        with:
          name: docs-pdf
          path: dist/pdf

      - name: Download PNGs
        uses: actions/download-artifact@v4
        with:
          name: docs-png
          path: dist/png

      # Supprimer proprement l’ancienne release/tag 'latest' avant recréation
      - name: Remove previous 'latest' release & tag (idempotent)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Supprimer la release 'latest' si elle existe
          if gh release view latest >/dev/null 2>&1; then
            echo "Deleting existing release 'latest'…"
            gh release delete latest -y
          else
            echo "No existing 'latest' release."
          fi
          # Supprimer la ref du tag 'latest' côté serveur (si elle existe)
          gh api \
            --method DELETE \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/git/refs/tags/latest" \
            >/dev/null 2>&1 || echo "Tag ref 'latest' not found (ok)."

      # ✅ Génère une description lisible de la Release
      - name: Build release body
        run: |
          set -euo pipefail
          {
            echo "# Documentation – build sur main"
            echo
            echo "Cette Release *latest* contient les documents générés automatiquement à partir de \`docs/\` :"
            echo
            echo "## PDF disponibles"
            if compgen -G "dist/pdf/*.pdf" > /dev/null; then
              for f in dist/pdf/*.pdf; do
                bn=$(basename "$f")
                echo "- $bn"
              done
            else
              echo "_Aucun PDF généré._"
            fi
            echo
            echo "## PNG disponibles (diagrammes)"
            if compgen -G "dist/png/*.png" > /dev/null; then
              for f in dist/png/*.png; do
                bn=$(basename "$f")
                echo "- $bn"
              done
            else
              echo "_Aucun PNG généré._"
            fi
            echo
            echo "## Utilisation"
            echo "- Téléchargez directement les **PDF individuels** pour diffusion."
            echo "- Les **PNG** sont attachés individuellement (pas besoin de dézipper)."
            echo
            echo "> Astuce : pour une version figée, publiez un tag \`vX.Y.Z\` — une Release correspondante sera créée avec les mêmes assets."
          } > release-body.md

      # ✅ Crée la nouvelle Release 'latest' + upload des assets individuels
      - name: Create rolling release (latest) with assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest docs (main)
          prerelease: false
          generate_release_notes: true
          body_path: release-body.md
          files: |
            dist/pdf/*.pdf
            dist/png/*.png
            docs/legal/*.pdf
            docs/legal/*.docx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
