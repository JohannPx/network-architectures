name: Release docs

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1) Dépendances système (Pandoc + LuaLaTeX + polices Noto + LM)
      - name: Install system deps (Pandoc + LuaLaTeX + Fonts)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-luatex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            lmodern \
            fonts-noto-core \
            fonts-noto-mono
          # Vérifications (fail fast si manquants)
          pandoc -v | head -n 2
          luaotfload-tool -u        # prépare l’index des polices pour LuaLaTeX
          lualatex --version | head -n 1

      # 2) Python pour process.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      # 3) Build
      - name: Build PDFs & PNGs
        run: |
          python scripts/process.py --docs docs --out build
          echo "== PDFs ==" && ls -al build/pdf || true
          echo "== PNGs ==" && ls -al build/png || true
          echo "== Legal docs (optionnels) ==" && ls -al docs/legal || true

      # 4) Release (mise à jour de la release 'latest', remplacement des assets)
      - name: Publish release with assets (PDF + PNG + legal docs)
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest docs (main)
          allowUpdates: true
          generateReleaseNotes: false
          draft: false
          prerelease: false
          artifacts: |
            build/pdf/*.pdf,
            build/png/*.png,
            docs/legal/*.pdf,
            docs/legal/*.doc,
            docs/legal/*.docx
