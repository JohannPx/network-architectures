name: Build & Release diagrams

on:
  push:
    branches:
      - main
      - draft

permissions:
  contents: write  # nécessaire pour créer une Release

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Mermaid CLI
        run: |
          npm i -g @mermaid-js/mermaid-cli@10
          sudo apt-get update
          # Polices pour bon rendu des emojis
          sudo apt-get install -y fonts-noto fonts-noto-color-emoji fonts-emojione

      - name: Prepare folders
        run: |
          mkdir -p build/md_processed
          mkdir -p exports/png
          mkdir -p scripts

      - name: Create Puppeteer config
        run: |
          cat > scripts/puppeteer.json << 'JSON'
          {
            "args": ["--no-sandbox", "--disable-setuid-sandbox", "--font-render-hinting=none"]
          }
          JSON

      - name: Add extractor script
        shell: bash
        run: |
          cat > scripts/extract_mermaid_and_replace.py << 'PY'
          import re
          import os
          import sys
          import subprocess
          import pathlib
          import json

          SRC_DIRS = ["docs"]
          PNG_DIR = pathlib.Path("exports/png")
          OUT_DIR = pathlib.Path("build/md_processed")

          # Pattern pour détecter les blocs mermaid (case insensitive)
          mermaid_block = re.compile(r"```[mM]ermaid\s*(.*?)\s*```", re.DOTALL)

          def render_mermaid_to_png(mmd_text, out_png):
              """Convertit un bloc Mermaid en PNG"""
              tmp_mmd = out_png.with_suffix(".mmd")
              print(f"  Rendering: {out_png.name}")
              
              # NE PAS nettoyer les emojis - Mermaid peut les rendre !
              # Écrire le fichier temporaire .mmd avec les emojis
              tmp_mmd.write_text(mmd_text, encoding="utf-8")
              
              try:
                  # Utiliser mmdc avec config pour supporter les emojis
                  result = subprocess.run(
                      ["mmdc", "-i", str(tmp_mmd), "-o", str(out_png), 
                       "--puppeteerConfigFile", "scripts/puppeteer.json",
                       "--theme", "default",
                       "--width", "1200",
                       "--height", "800"],
                      capture_output=True,
                      text=True,
                      timeout=30
                  )
                  
                  if result.returncode != 0:
                      print(f"    Warning: mmdc with config failed: {result.stderr}")
                      # Essayer sans config puppeteer
                      result2 = subprocess.run(
                          ["mmdc", "-i", str(tmp_mmd), "-o", str(out_png),
                           "--width", "1200", "--height", "800"],
                          capture_output=True,
                          text=True,
                          timeout=30
                      )
                      if result2.returncode != 0:
                          print(f"    Error: mmdc failed: {result2.stderr}")
                  
                  if out_png.exists():
                      size = out_png.stat().st_size
                      print(f"    ✓ Created: {out_png.name} ({size} bytes)")
                      if size < 100:
                          print(f"    Warning: PNG file seems too small ({size} bytes)")
                  else:
                      print(f"    ✗ Failed to create: {out_png}")
                      
              except subprocess.TimeoutExpired:
                  print(f"    ✗ Timeout while rendering")
              except Exception as e:
                  print(f"    ✗ Error rendering: {e}")
              finally:
                  tmp_mmd.unlink(missing_ok=True)

          def process_md(md_path):
              """Traite un fichier Markdown"""
              rel = pathlib.Path(md_path).relative_to(".")
              print(f"\nProcessing: {rel}")
              
              text = pathlib.Path(md_path).read_text(encoding="utf-8")
              
              # Chercher les blocs mermaid
              matches = list(mermaid_block.finditer(text))
              print(f"  Found {len(matches)} mermaid blocks")
              
              if matches:
                  # Afficher le début du premier bloc pour debug
                  first_block = matches[0].group(1)[:100]
                  print(f"  First block preview: {first_block}...")
              
              idx = 0
              def repl(match):
                  nonlocal idx
                  code = match.group(1).strip()
                  
                  # Créer un nom de fichier unique
                  stem = rel.as_posix().replace("/", "_").replace(".md", "")
                  png_name = f"{stem}_m{idx}.png"
                  out_png = PNG_DIR / png_name
                  
                  # Créer le répertoire si nécessaire
                  out_png.parent.mkdir(parents=True, exist_ok=True)
                  
                  # Convertir en PNG (avec emojis!)
                  render_mermaid_to_png(code, out_png)
                  idx += 1
                  
                  # Retourner le lien vers l'image
                  return f"![Diagram {idx}](exports/png/{png_name})"

              # Remplacer les blocs mermaid par des images
              new_text = mermaid_block.sub(repl, text)
              
              # Vérifier si des remplacements ont été faits
              if text != new_text:
                  print(f"  ✓ Replaced {idx} mermaid blocks with images")
              else:
                  print(f"  → No changes made")
              
              # Écrire le fichier modifié (avec les emojis préservés!)
              out_file = OUT_DIR / rel
              out_file.parent.mkdir(parents=True, exist_ok=True)
              out_file.write_text(new_text, encoding="utf-8")
              print(f"  Wrote: {out_file}")

          def main():
              print("=== Mermaid to PNG Converter ===")
              
              # Vérifier que mmdc est installé
              try:
                  result = subprocess.run(["mmdc", "--version"], capture_output=True, text=True)
                  print(f"Mermaid CLI version: {result.stdout.strip()}")
              except FileNotFoundError:
                  print("ERROR: mmdc not found! Please install @mermaid-js/mermaid-cli")
                  sys.exit(1)
              
              # Lister tous les fichiers MD
              md_files = []
              for root in SRC_DIRS:
                  if pathlib.Path(root).exists():
                      for p in pathlib.Path(root).rglob("*.md"):
                          md_files.append(str(p))
              
              print(f"Found {len(md_files)} markdown files")
              
              if not md_files:
                  print("Warning: No markdown files found!")
                  # Créer un fichier de test si aucun n'existe
                  test_dir = pathlib.Path("docs")
                  test_dir.mkdir(exist_ok=True)
                  test_file = test_dir / "test.md"
                  test_file.write_text("# Test\n\nNo mermaid content", encoding="utf-8")
                  md_files = [str(test_file)]
              
              # Traiter chaque fichier
              for md_file in md_files:
                  process_md(md_file)
              
              # Vérifier les résultats
              png_files = list(PNG_DIR.glob("*.png"))
              print(f"\n=== Results ===")
              print(f"Generated {len(png_files)} PNG files")
              
              if png_files:
                  print("PNG files created:")
                  for png in png_files[:10]:  # Afficher max 10
                      print(f"  - {png.name} ({png.stat().st_size} bytes)")
                  if len(png_files) > 10:
                      print(f"  ... and {len(png_files) - 10} more")
              else:
                  print("Warning: No PNG files were generated!")
                  print("Possible causes:")
                  print("  - No mermaid blocks found in markdown files")
                  print("  - Mermaid syntax errors in the diagrams")
                  print("  - mmdc rendering failures")

          if __name__ == "__main__":
              main()
          PY

      - name: Check for Mermaid blocks in source files
        run: |
          echo "=== Checking for Mermaid blocks in source files ==="
          for file in docs/**/*.md; do
            if [ -f "$file" ]; then
              echo "Checking: $file"
              if grep -i "^\`\`\`mermaid" "$file" > /dev/null; then
                echo "  ✓ Contains Mermaid blocks"
                echo "  First mermaid block:"
                awk '/^```[mM]ermaid/,/^```/' "$file" | head -n 10
              else
                echo "  - No Mermaid blocks found"
              fi
            fi
          done
          echo ""

      - name: Extract Mermaid blocks to PNG and rewrite MD
        run: |
          echo "=== Starting Mermaid extraction ==="
          python3 scripts/extract_mermaid_and_replace.py
          echo ""
          echo "=== Checking results ==="
          if [ -d "exports/png" ]; then
            echo "PNG files generated:"
            ls -la exports/png/ || echo "Empty directory"
          else
            echo "ERROR: exports/png directory not created!"
          fi

      - name: Debug - List generated files
        run: |
          echo "=== PNG files in exports/png ==="
          ls -la exports/png/ || echo "No PNG directory"
          echo ""
          echo "=== MD files in build/md_processed ==="
          find build/md_processed -name "*.md" -exec echo {} \; || echo "No processed MD files"
          echo ""
          echo "=== Sample of processed MD content ==="
          if [ -f "build/md_processed/docs/remote-access/remote-access-ewon.md" ]; then
            echo "First 30 lines of remote-access-ewon.md:"
            head -n 30 build/md_processed/docs/remote-access/remote-access-ewon.md
          fi

      - name: Install pandoc and XeLaTeX (avec support emoji)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-latex-base \
            texlive-fonts-recommended \
            texlive-latex-extra \
            fonts-noto \
            fonts-noto-color-emoji \
            fonts-emojione \
            fonts-dejavu \
            fonts-liberation

      - name: Build consolidated PDF with pandoc (AVEC EMOJIS!)
        run: |
          # Script Python pour créer le fichier consolidé SANS nettoyer les emojis
          python3 << 'PY'
          import pathlib
          import shutil
          from pathlib import Path
          
          # Créer l'en-tête
          consolidated = Path("build/Consolidated.md")
          
          # Écrire l'en-tête AVEC les emojis si vous voulez
          header = "# Network Architectures - Remote Access 🌐🔒\n\n"
          consolidated.write_text(header, encoding="utf-8")
          
          # Trouver et ajouter tous les fichiers MD
          md_files = sorted(Path("build/md_processed").rglob("*.md"))
          
          if not md_files:
              print("Warning: No processed MD files found!")
              with open(consolidated, "a", encoding="utf-8") as out:
                  out.write("\n## No content found\n\n")
                  out.write("Please add markdown files in the docs/ directory.\n")
          else:
              print(f"Consolidating {len(md_files)} files...")
              for md_file in md_files:
                  print(f"  Adding: {md_file}")
                  with open(consolidated, "a", encoding="utf-8") as out:
                      out.write("\n\n---\n\n")
                      content = md_file.read_text(encoding="utf-8")
                      # NE PAS nettoyer le contenu - garder les emojis!
                      out.write(content)
          
          print(f"Created: {consolidated}")
          
          # Copier les images PNG dans le répertoire build pour qu'elles soient accessibles
          png_source = Path("exports/png")
          png_dest = Path("build/exports/png")
          
          if png_source.exists() and any(png_source.glob("*.png")):
              png_dest.mkdir(parents=True, exist_ok=True)
              count = 0
              for png in png_source.glob("*.png"):
                  shutil.copy2(png, png_dest / png.name)
                  count += 1
              print(f"\nCopied {count} PNG files to build/exports/png")
          else:
              print("\nWARNING: No PNG files found to copy!")
          PY
          
          # Vérifier que le fichier consolidé est créé
          echo ""
          echo "=== Checking consolidated file ==="
          if [ -f "build/Consolidated.md" ]; then
            echo "Consolidated.md exists"
          else
            echo "ERROR: Consolidated.md not found!"
          fi
          
          # Générer le PDF avec XeLaTeX qui supporte les emojis
          echo ""
          echo "=== Generating PDF with emoji support ==="
          cd build
          
          # Utiliser XeLaTeX directement pour le support des emojis
          pandoc Consolidated.md -o Remote-Access-Architectures.pdf \
            --pdf-engine=xelatex \
            --variable geometry:margin=1in \
            --variable fontsize=11pt \
            --variable mainfont="DejaVu Sans" \
            --variable monofont="DejaVu Sans Mono" \
            --variable mathfont="DejaVu Math TeX Gyre" \
            --variable CJKmainfont="Noto Sans CJK SC" \
            --variable colorlinks=true \
            --highlight-style=tango \
            -V "fontfamily:noto" \
            2>&1 || {
              echo "XeLaTeX with DejaVu failed, trying with Noto fonts..."
              pandoc Consolidated.md -o Remote-Access-Architectures.pdf \
                --pdf-engine=xelatex \
                --variable geometry:margin=1in \
                --variable fontsize=11pt \
                --variable mainfont="Noto Sans" \
                --variable monofont="Noto Sans Mono" \
                --variable colorlinks=true \
                --highlight-style=tango \
                2>&1 || echo "PDF generation failed, continuing..."
            }
          
          # Vérifier si le PDF a été créé
          echo ""
          if [ -f "Remote-Access-Architectures.pdf" ]; then
            echo "✓ PDF file created with emoji support!"
            ls -lh Remote-Access-Architectures.pdf
          else
            echo "✗ PDF was not created"
            # Créer un PDF minimal
            echo "Creating minimal PDF..."
            echo "# Documentation" > minimal.md
            echo "PDF generation failed. Please check PNG exports." >> minimal.md
            pandoc minimal.md -o Remote-Access-Architectures.pdf 2>/dev/null || true
          fi

      - name: Zip PNG exports
        run: |
          if [ -d "exports/png" ] && [ "$(ls -A exports/png)" ]; then
            cd exports
            zip -r ../build/diagrams-png.zip png
            cd ..
            echo "Created diagrams-png.zip with PNG files"
          else
            echo "No PNG files to zip, creating empty archive"
            mkdir -p exports/png
            echo "No diagrams were generated from Mermaid blocks" > exports/png/README.txt
            echo "Please check that your markdown files contain valid Mermaid blocks" >> exports/png/README.txt
            cd exports
            zip -r ../build/diagrams-png.zip png
            cd ..
          fi

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Documentation Build #${{ github.run_number }} - ${{ steps.date.outputs.date }}"
          draft: false
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          body: |
            ## 📚 Documentation Release avec Emojis! 🚀
            
            **Build:** #${{ github.run_number }}
            **Date:** ${{ steps.date.outputs.date }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            
            ### 📦 Artifacts
            - `Remote-Access-Architectures.pdf` - Documentation complète en PDF avec emojis 💻🌐
            - `diagrams-png.zip` - Diagrammes Mermaid exportés en PNG
            
            ### 🔄 Changes
            See commit history for details.
          files: |
            build/Remote-Access-Architectures.pdf
            build/diagrams-png.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}