name: Publication des documents

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-et-release:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      # 1) Dépendances système : Pandoc + LuaLaTeX + polices Noto/LM
      - name: Installer Pandoc, LaTeX et polices
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-luatex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            lmodern \
            fonts-noto-core \
            fonts-noto-mono
          pandoc -v | head -n 2
          luaotfload-tool -u
          lualatex --version | head -n 1

      # 2) Environnement Python pour exécuter scripts/process.py
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      # 3) Build local (PDF + PNG)
      - name: Générer les PDFs et PNGs
        run: |
          python scripts/process.py --docs docs --out build
          echo "::group::PDF générés"
          ls -al build/pdf || true
          echo "::endgroup::"
          echo "::group::PNG générés"
          ls -al build/png || true
          echo "::endgroup::"

      # 4) Préparer la liste d’assets et les notes de release
      - name: Collecter les assets et composer la description
        id: collate
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          PDF_DIR="build/pdf"
          PNG_DIR="build/png"
          LEGAL_DIR="docs/legal"

          files=()
          for f in "$PDF_DIR"/*.pdf; do files+=("$f"); done
          for f in "$PNG_DIR"/*.png; do files+=("$f"); done
          for f in "$LEGAL_DIR"/*.pdf "$LEGAL_DIR"/*.doc" "$LEGAL_DIR"/*.docx; do files+=("$f"); done

          printf "%s\n" "${files[@]}" > assets.txt
          echo "files_count=${#files[@]}" >> "$GITHUB_OUTPUT"

          {
            echo "## Network Architectures — export PDF & PNG"
            echo
            echo "Cette release met à disposition la **dernière version** des documents générés à partir des fichiers Markdown + Mermaid."
            echo
            echo "### Contenu"
            echo "- **PDF** : rendus complets des documents"
            echo "- **PNG** : diagrammes Mermaid rasterisés"
            echo "- **Légaux** : modèles nécessaires (s’ils sont présents) pour GRDF/Enedis"
            echo
            if (( ${#files[@]} > 0 )); then
              echo "### Fichiers publiés"
              for f in "${files[@]}"; do
                echo "- $(basename "$f")"
              done
              echo
            fi
            echo "_Release mise à jour automatiquement à chaque push sur \`main\` (tag \`latest\`)._"
          } > RELEASE_NOTES.md

      # 5) Authentifier la CLI GitHub
      - name: Authentification gh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh auth status

      # 6) Supprimer l’ancienne release/tag 'latest' pour repartir propre
      - name: Supprimer ancienne release et tag 'latest' (si présents)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view latest >/dev/null 2>&1 && gh release delete latest -y || true
          git tag -l | grep -q '^latest$' && git push origin :refs/tags/latest || true

      # 7) Créer la release et téléverser les assets
      - name: Créer la release et téléverser les fichiers
        if: steps.collate.outputs.files_count != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create latest \
            --title "Latest docs (main)" \
            --notes-file RELEASE_NOTES.md

          while IFS= read -r f; do
            [ -n "$f" ] && gh release upload latest "$f" --clobber
          done < assets.txt

      # 8) Créer la release sans assets si rien à publier (cas rare)
      - name: Créer la release (sans fichiers)
        if: steps.collate.outputs.files_count == '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest \
            --title "Latest docs (main)" \
            --notes-file RELEASE_NOTES.md
