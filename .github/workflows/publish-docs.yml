name: Release docs

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # (1) Setup Python pour exécuter ton process.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      # (2) Build
      - name: Build PDFs & PNGs
        run: |
          python scripts/process.py --docs docs --out build
          echo "== PDFs générés ==" && ls -al build/pdf || true
          echo "== PNGs générés ==" && ls -al build/png || true
          echo "== Docs légaux (si présents) =="
          ls -al docs/legal       || true
          ls -al docs/juridique   || true

      # (3) Créer/mettre à jour LA release "Latest docs"
      - name: Publish release with assets (PDF + PNG + Légaux)
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest docs (main)
          allowUpdates: true
          generateReleaseNotes: false
          draft: false
          prerelease: false
          artifacts: |
            build/pdf/*.pdf,
            build/png/*.png,
            docs/legal/*.pdf,
            docs/legal/*.docx
