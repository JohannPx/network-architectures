name: Build & Release diagrams

on:
  push:
    branches:
      - main
      - draft

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          # Installer mermaid-cli
          npm install -g @mermaid-js/mermaid-cli
          
          # Installer pandoc et LaTeX
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-latex-extra \
            fonts-noto \
            fonts-noto-color-emoji \
            chromium-browser

      - name: Process Markdown files
        run: |
          mkdir -p build/pdf
          mkdir -p build/png
          mkdir -p temp
          
          # Créer config puppeteer
          cat > puppeteer-config.json << 'JSON'
          {
            "executablePath": "/usr/bin/chromium-browser",
            "args": ["--no-sandbox", "--disable-setuid-sandbox", "--disable-dev-shm-usage"]
          }
          JSON
          
          # Script de traitement
          cat > process.py << 'PYTHON'
          import os
          import re
          import subprocess
          import pathlib
          import shutil
          
          def clean_mermaid(code):
              # Nettoyer syntaxe non standard
              code = re.sub(r'(\w+)@\{\s*shape:\s*das,\s*label:\s*"([^"]+)"\s*\}', r'\1["\2"]', code)
              code = re.sub(r'\w+@\{\s*animation:\s*\w+\s*\}', '', code)
              code = re.sub(r'(\w+)\s+e\d+@', r'\1 ', code)
              return code
          
          def process_file(md_path):
              print(f"\nProcessing: {md_path}")
              content = md_path.read_text(encoding='utf-8')
              
              # Trouver et remplacer les blocs mermaid
              counter = 0
              def replace_mermaid(match):
                  nonlocal counter
                  code = clean_mermaid(match.group(1))
                  
                  # Générer nom unique
                  stem = str(md_path.relative_to('docs')).replace('/', '_').replace('.md', '')
                  png_name = f"{stem}_{counter}.png"
                  png_path = pathlib.Path(f"build/png/{png_name}")
                  
                  # Créer fichier mermaid temporaire
                  mmd_file = pathlib.Path(f"temp/temp_{counter}.mmd")
                  mmd_file.write_text(code, encoding='utf-8')
                  
                  # Générer PNG avec mmdc
                  cmd = [
                      'mmdc', '-i', str(mmd_file), '-o', str(png_path),
                      '-p', 'puppeteer-config.json',
                      '--width', '1200', '--height', '800'
                  ]
                  
                  try:
                      result = subprocess.run(cmd, capture_output=True, timeout=30)
                      if png_path.exists():
                          print(f"  ✓ Generated PNG: {png_name}")
                          counter += 1
                          return f"![](../png/{png_name})"
                      else:
                          print(f"  ✗ PNG failed")
                          return match.group(0)  # Garder le bloc original
                  except:
                      print(f"  ✗ PNG error")
                      return match.group(0)
              
              # Remplacer tous les blocs mermaid
              pattern = re.compile(r'^```mermaid\s*\n(.*?)\n```', re.MULTILINE | re.DOTALL)
              processed = pattern.sub(replace_mermaid, content)
              
              # Sauvegarder le MD traité temporairement
              temp_md = pathlib.Path(f"temp/{md_path.name}")
              temp_md.write_text(processed, encoding='utf-8')
              
              # Générer PDF
              pdf_name = str(md_path.relative_to('docs')).replace('/', '_').replace('.md', '.pdf')
              pdf_path = pathlib.Path(f"build/pdf/{pdf_name}")
              
              # Essayer avec XeLaTeX pour les emojis
              cmd = [
                  'pandoc', str(temp_md), '-o', str(pdf_path),
                  '--pdf-engine=xelatex',
                  '--variable', 'geometry:margin=1in',
                  '--variable', 'mainfont=Noto Sans'
              ]
              
              result = subprocess.run(cmd, capture_output=True, cwd='temp')
              
              if not pdf_path.exists():
                  # Fallback pdflatex
                  subprocess.run(['pandoc', str(temp_md), '-o', str(pdf_path)], cwd='temp')
              
              if pdf_path.exists():
                  print(f"  ✓ Generated PDF: {pdf_name}")
              else:
                  print(f"  ✗ PDF failed")
          
          # Traiter tous les MD sous docs/
          docs_dir = pathlib.Path('docs')
          if docs_dir.exists():
              for md_file in docs_dir.rglob('*.md'):
                  process_file(md_file)
          
          # Stats finales
          png_count = len(list(pathlib.Path('build/png').glob('*.png')))
          pdf_count = len(list(pathlib.Path('build/pdf').glob('*.pdf')))
          print(f"\n✅ Generated: {png_count} PNGs, {pdf_count} PDFs")
          PYTHON
          
          python3 process.py

      - name: Verify outputs
        run: |
          echo "=== PNG files ==="
          ls -la build/png/ || echo "No PNG"
          echo ""
          echo "=== PDF files ==="
          ls -la build/pdf/ || echo "No PDF"

      - name: Create archives for release
        run: |
          cd build
          
          # Créer archive ZIP des PDFs
          if [ -d "pdf" ] && [ "$(ls -A pdf)" ]; then
            zip -r PDFs.zip pdf/
            echo "✓ Created PDFs.zip"
          else
            echo "No PDFs to archive"
            echo "No PDFs generated" > PDFs.txt
            zip PDFs.zip PDFs.txt
          fi
          
          # Créer archive ZIP des PNGs
          if [ -d "png" ] && [ "$(ls -A png)" ]; then
            zip -r PNGs.zip png/
            echo "✓ Created PNGs.zip"
          else
            echo "No PNGs to archive"
            echo "No PNGs generated" > PNGs.txt
            zip PNGs.zip PNGs.txt
          fi
          
          cd ..

      - name: Upload as GitHub Artifacts (for Actions tab)
        uses: actions/upload-artifact@v3
        with:
          name: documentation-outputs
          path: |
            build/pdf/
            build/png/

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create Release with assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Documentation Build #${{ github.run_number }} - ${{ steps.date.outputs.date }}"
          draft: false
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          body: |
            ## 📚 Documentation Release
            
            **Date:** ${{ steps.date.outputs.date }}  
            **Branch:** ${{ github.ref_name }}  
            **Build:** #${{ github.run_number }}
            
            ### 📦 Assets
            
            - **PDFs.zip** - Tous les documents PDF avec emojis et diagrammes intégrés
            - **PNGs.zip** - Tous les diagrammes Mermaid exportés en PNG
            
            ### 📄 Contenu
            
            Les PDFs contiennent :
            - Documentation complète depuis `/docs`
            - Diagrammes Mermaid convertis et intégrés
            - Support des emojis 🚀
            
            ### 💡 Usage
            
            1. Téléchargez `PDFs.zip` pour la documentation complète
            2. Téléchargez `PNGs.zip` pour les diagrammes seuls
          files: |
            build/PDFs.zip
            build/PNGs.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}