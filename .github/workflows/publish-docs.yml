name: Build & Publish Docs

on:
  push:
    branches: [ "main" ]
    tags:     [ "v*" ]      # tag v1.2.3 => release
  workflow_dispatch:

concurrency:
  group: publish-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build PDFs & PNGs
    runs-on: ubuntu-latest

    # Pandoc + LaTeX préinstallés
    container:
      image: pandoc/latex:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pas d'apt-get : on installe Python via l'action officielle
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          # ton script n'a besoin que de 'requests'
          pip install requests

      # (Optionnel) Mermaid CLI offline — évite Internet pour les PNG
      # - name: Install Mermaid CLI (offline)
      #   run: |
      #     apt-get update && apt-get install -y npm chromium || true
      #     npm i -g @mermaid-js/mermaid-cli || true

      - name: Build (PNG + PDF)
        run: |
          python3 scripts/process.py --docs docs --out build

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: docs-pdf
          path: build/pdf/*.pdf
          if-no-files-found: error

      - name: Upload PNGs
        uses: actions/upload-artifact@v4
        with:
          name: docs-png
          path: build/png/*.png
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download PDFs
        uses: actions/download-artifact@v4
        with:
          name: docs-pdf
          path: dist/pdf

      - name: Download PNGs
        uses: actions/download-artifact@v4
        with:
          name: docs-png
          path: dist/png

      - name: Package archives
        run: |
          tar -czf docs-pdf.tar.gz -C dist/pdf .
          tar -czf diagrams-png.tar.gz -C dist/png . || true

      - name: Create/Update Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            docs-pdf.tar.gz
            diagrams-png.tar.gz
            dist/pdf/*.pdf
