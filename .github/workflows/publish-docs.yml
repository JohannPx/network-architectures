name: Build & Release Documentation

on:
  push:
    branches:
      - main
      - draft

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-latex-extra \
            fonts-noto \
            fonts-noto-color-emoji

      - name: Generate PDFs from Markdown
        run: |
          mkdir -p build/pdf
          mkdir -p build/png
          
          # Générer un PDF pour chaque fichier MD sous docs/
          for mdfile in docs/**/*.md; do
            if [ -f "$mdfile" ]; then
              # Créer le nom du PDF
              pdfname=$(echo "$mdfile" | sed 's|docs/||' | sed 's|/|_|g' | sed 's|\.md|\.pdf|')
              
              echo "Converting $mdfile to build/pdf/$pdfname"
              
              # Convertir avec XeLaTeX pour support emoji
              pandoc "$mdfile" \
                -o "build/pdf/$pdfname" \
                --pdf-engine=xelatex \
                --variable mainfont="Noto Sans" \
                --variable geometry:margin=1in \
                --variable fontsize=11pt \
                --highlight-style=tango 2>/dev/null || \
              # Fallback sur pdflatex si XeLaTeX échoue
              pandoc "$mdfile" \
                -o "build/pdf/$pdfname" \
                --pdf-engine=pdflatex 2>/dev/null || \
              echo "  Failed to convert $mdfile"
            fi
          done
          
          # Compter les résultats
          pdf_count=$(ls -1 build/pdf/*.pdf 2>/dev/null | wc -l)
          echo "Generated $pdf_count PDF files"

      - name: Create ZIP archives
        run: |
          cd build
          
          # Archive des PDFs
          if [ "$(ls -A pdf 2>/dev/null)" ]; then
            zip -r PDFs.zip pdf/
            echo "Created PDFs.zip with $(ls -1 pdf/*.pdf | wc -l) files"
          else
            echo "No PDFs found"
            echo "No PDFs were generated" > pdf/README.txt
            zip -r PDFs.zip pdf/
          fi
          
          # Archive des PNGs (même si vide pour l'instant)
          mkdir -p png
          echo "PNG generation not implemented yet" > png/README.txt
          zip -r PNGs.zip png/
          
          cd ..

      - name: List generated files
        run: |
          echo "=== Files in build/ ==="
          ls -la build/
          echo ""
          echo "=== PDFs generated ==="
          ls -la build/pdf/ 2>/dev/null || echo "No PDFs"
          echo ""
          echo "=== ZIP contents ==="
          if [ -f "build/PDFs.zip" ]; then
            unzip -l build/PDFs.zip | head -20
          fi

      - name: Upload artifacts to Actions tab
        uses: actions/upload-artifact@v4
        with:
          name: documentation-outputs
          path: build/
          retention-days: 30

      - name: Get date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Build #${{ github.run_number }} - ${{ steps.date.outputs.date }}"
          draft: false
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          body: |
            ## Documentation Build
            
            **Date:** ${{ steps.date.outputs.date }}  
            **Branch:** ${{ github.ref_name }}  
            **Build:** #${{ github.run_number }}
            
            ### Assets
            
            - **PDFs.zip** - All PDF documents
            - **PNGs.zip** - Diagrams (if any)
            
            Download the ZIP files below.
          files: |
            build/PDFs.zip
            build/PNGs.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}